<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hozzám jössz feleségül?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #fff8fb;
            --bg-2: #f7e8ee;
            --card: #fffafc;
            --text: #4b2437;
            --muted: #8a5b6d;
            --accent: #cf6f95;
            --accent-2: #f1b8ca;
            --gold: #d8b36a;
            --shadow: 0 20px 60px rgba(105,49,73,.18);
            --radius: 28px;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter,system-ui,sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(255,255,255,.8), transparent 34%), radial-gradient(circle at bottom right, rgba(255,214,229,.8), transparent 28%), linear-gradient(160deg, var(--bg-1), var(--bg-2));
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 18px 48px;
            position: relative;
            isolation: isolate;
        }

        .sparkles::before,
        .sparkles::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, rgba(255,255,255,.8) 0 2px, transparent 3px), radial-gradient(circle, rgba(255,255,255,.5) 0 1px, transparent 2px);
            background-size: 180px 180px, 120px 120px;
            background-position: 0 0, 50px 30px;
            opacity: .35;
            z-index: -1;
        }

        .card {
            width: min(100%, 980px);
            background: rgba(255,250,252,.72);
            border: 1px solid rgba(255,255,255,.65);
            backdrop-filter: blur(18px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12,1fr);
            gap: 16px;
            align-items: center;
        }

        .photo {
            border-radius: 24px;
            overflow: hidden;
            min-height: 170px;
            box-shadow: 0 14px 36px rgba(73,29,50,.14);
            border: 4px solid rgba(255,255,255,.75);
            background: #f5dfe7;
        }

            .photo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

        .p1 {
            grid-column: 1 / span 3;
            transform: translateY(-8px) rotate(-3deg);
        }

        .p2 {
            grid-column: 10 / span 3;
            transform: translateY(-10px) rotate(3deg);
        }

        .p3 {
            grid-column: 1 / span 3;
            transform: translateY(8px) rotate(2deg);
        }

        .p4 {
            grid-column: 10 / span 3;
            transform: translateY(12px) rotate(-2deg);
        }

        .hero {
            grid-column: 4 / span 6;
            text-align: center;
            padding: 22px 10px;
        }

        .kicker {
            letter-spacing: .28em;
            text-transform: uppercase;
            font-size: .78rem;
            color: var(--muted);
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(3rem, 6vw, 5.6rem);
            line-height: .95;
            color: var(--text);
            text-shadow: 0 1px 0 rgba(255,255,255,.65);
        }

        .line {
            width: 110px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 24px auto;
        }

        .subtitle {
            margin: 0 auto;
            max-width: 34ch;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .heart {
            width: 74px;
            height: 74px;
            margin: 22px auto 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(255,226,236,.92));
            box-shadow: 0 10px 28px rgba(112,46,74,.14);
            font-size: 1.7rem;
        }

        .footer-note {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: .95rem;
        }

        @media (max-width: 820px) {
            .card {
                padding: 20px
            }

            .grid {
                grid-template-columns: 1fr 1fr;
            }

            .hero {
                grid-column: 1 / -1;
                order: -1;
                padding: 6px 6px 18px;
            }

            .p1, .p2, .p3, .p4 {
                grid-column: auto;
                transform: none;
                min-height: 180px;
            }
        }

        @media (max-width: 520px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .photo {
                min-height: 190px
            }

            h1 {
                font-size: clamp(2.6rem, 12vw, 4rem)
            }

            .subtitle {
                font-size: 1rem
            }
        }
    </style>
</head>
<body>
    <main class="page sparkles">
        <section class="card">
            <div class="grid">
                <figure class="photo p1">
                    <img src="https://pplx-res.cloudinary.com/image/upload/pplx_search_images/390307545a70939ad41c02ead82dfdfe07b463a0.jpg" alt="Romantikus rózsafüzér fények" width="750" height="750" loading="lazy">
                </figure>
                <div class="hero">
                    <div class="kicker">Egy különleges kérdés</div>
                    <h1>Hozzám jössz<br>feleségül?</h1>
                    <div class="line"></div>
                    <p class="subtitle">Egyelőre teszt, álomszerű képekkel körülölelve — később ide jöhetnek a közös emlékeitek, a kedvenc fotóitok és az igazi pillanat.</p>
                    <div class="heart">💍</div>
                </div>
                <figure class="photo p2">
                    <img src="https://pplx-res.cloudinary.com/image/upload/pplx_search_images/834458bd7aca70ad2eb3949075f7103c6464c504.jpg" alt="Virág mellett eljegyzési gyűrű" width="688" height="862" loading="lazy">
                </figure>
                <figure class="photo p3">
                    <img src="https://pplx-res.cloudinary.com/image/upload/pplx_search_images/95d8d3bebea11cbcb535f31a2ed5d2f115084821.jpg" alt="Romantikus naplementés jelenet virágok között" width="512" height="512" loading="lazy">
                </figure>
                <figure class="photo p4">
                    <img src="https://pplx-res.cloudinary.com/image/upload/pplx_search_images/ff0abe9a02bf227ab0ec3d0624801d1f5aa474d4.jpg" alt="Virágos, álomszerű romantikus páros jelenet" width="3593" height="1960" loading="lazy">
                </figure>
            </div>
            <p class="footer-note">A QR-kód majd erre a külön oldalra mutathat.</p>
        </section>
    </main>
</body>
</html>
