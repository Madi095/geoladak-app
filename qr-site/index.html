<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hozzám jössz feleségül?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff7fb;
            --bg-soft: #f8e6ef;
            --card: rgba(255,255,255,.68);
            --text: #4a2435;
            --muted: #8b5f71;
            --accent: #d16f98;
            --gold: #d8b26c;
            --shadow: 0 24px 70px rgba(97,41,67,.18);
            --radius: 30px;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter,system-ui,sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(255,255,255,.85), transparent 30%), radial-gradient(circle at bottom right, rgba(255,216,231,.9), transparent 32%), linear-gradient(160deg, var(--bg), var(--bg-soft));
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            padding: 26px 18px 40px;
            display: grid;
            place-items: center;
            position: relative;
        }

            .page::before {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                background-image: radial-gradient(circle, rgba(255,255,255,.75) 0 2px, transparent 2.5px), radial-gradient(circle, rgba(255,255,255,.45) 0 1px, transparent 2px);
                background-size: 170px 170px, 120px 120px;
                background-position: 0 0, 40px 60px;
                opacity: .4;
            }

        .frame {
            width: min(100%, 1140px);
            background: var(--card);
            border: 1px solid rgba(255,255,255,.72);
            backdrop-filter: blur(18px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .layout {
            display: grid;
            grid-template-columns: repeat(12,1fr);
            gap: 16px;
            align-items: center;
        }

        .hero {
            grid-column: 4 / span 6;
            text-align: center;
            padding: 12px 8px;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: .28em;
            font-size: .78rem;
            color: var(--muted);
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(3.2rem, 6.2vw, 6rem);
            line-height: .94;
            text-wrap: balance;
        }

        .divider {
            width: 118px;
            height: 2px;
            margin: 22px auto;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .sub {
            margin: 0 auto;
            max-width: 34ch;
            font-size: 1.05rem;
            line-height: 1.75;
            color: var(--muted);
        }

        .ring {
            width: 78px;
            height: 78px;
            margin: 24px auto 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, rgba(255,255,255,.92), rgba(255,231,239,.9));
            box-shadow: 0 12px 28px rgba(105,47,73,.14);
            font-size: 1.8rem;
        }

        .photo {
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            border: 4px solid rgba(255,255,255,.78);
            box-shadow: 0 16px 36px rgba(72,30,49,.16);
            min-height: 185px;
            background: #f0dfe6;
        }

            .photo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .photo::after {
                content: "";
                position: absolute;
                inset: auto 0 0;
                height: 42%;
                background: linear-gradient(to top, rgba(0,0,0,.12), transparent);
                pointer-events: none;
            }

        .a {
            grid-column: 1 / span 3;
            transform: rotate(-4deg) translateY(-6px);
        }

        .b {
            grid-column: 10 / span 3;
            transform: rotate(4deg) translateY(-8px);
        }

        .c {
            grid-column: 1 / span 3;
            transform: rotate(3deg) translateY(8px);
        }

        .d {
            grid-column: 10 / span 3;
            transform: rotate(-3deg) translateY(10px);
        }

        .e {
            grid-column: 2 / span 3;
            transform: rotate(-2deg);
        }

        .f {
            grid-column: 8 / span 3;
            transform: rotate(2deg);
        }

        .note {
            text-align: center;
            color: var(--muted);
            margin-top: 20px;
            font-size: .95rem;
        }

        @media (max-width: 920px) {
            .layout {
                grid-template-columns: repeat(2,1fr)
            }

            .hero {
                grid-column: 1 / -1;
                order: -1;
                padding-bottom: 14px
            }

            .a, .b, .c, .d, .e, .f {
                grid-column: auto;
                transform: none
            }
        }

        @media (max-width: 560px) {
            .frame {
                padding: 18px
            }

            .layout {
                grid-template-columns: 1fr
            }

            .photo {
                min-height: 220px
            }

            h1 {
                font-size: clamp(2.8rem, 13vw, 4.2rem)
            }

            .sub {
                font-size: 1rem
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="frame">
            <div class="layout">
                <figure class="photo a">
                    <img src="755864556_1374618957973309_4850035632402350790_n.jpg" alt="Közös emlék portré egy itallal az asztalnál" width="768" height="1024" loading="lazy">
                </figure>
                <figure class="photo b">
                    <img src="755666939_1354747596148047_4705887858157765338_n.jpg" alt="Közös fotó kilátással egy üvegkupola alatt" width="768" height="1024" loading="lazy">
                </figure>

                <div class="hero">
                    <div class="divider"></div>
                    <p class="sub">A legszebb közös pillanatainkkal körülvéve szeretném feltenni neked ezt az egyetlen, igazán fontos kérdést.</p>
                    <div class="eyebrow">Nekünk szól</div>
                    <h1>Hozzám jössz<br>feleségül?</h1>
                    <div class="ring">💍</div>
                </div>

                <figure class="photo c">
                    <img src="757697831_1588997409256875_3118970206867850508_n.jpg" alt="Közös szelfi esti városi háttérrel" width="768" height="1024" loading="lazy">
                </figure>
                <figure class="photo d">
                    <img src="758386142_2206334196766565_6353911892250742529_n.jpg" alt="Mosolygós portré éttermi asztalnál" width="768" height="1024" loading="lazy">
                </figure>
                <figure class="photo e">
                    <img src="755151759_2058854474731562_1120972946395108901_n.jpg" alt="Közös naplementés fotó a vízparton" width="768" height="1024" loading="lazy">
                </figure>
                <figure class="photo f">
                    <img src="756219205_1694211411694329_8332223703575064966_n.jpg" alt="Otthoni, kedves portré egy Harry Potter pulóverben" width="768" height="1024" loading="lazy">
                </figure>
            </div>
            <p class="note">Életünk oldala.</p>
        </section>
    </main>
</body>
</html>
